# Default configuration for fusion-artifacts-engine

server:
  host: "127.0.0.1"
  port: 11451
  # R1: HTTP 线程池上限，防 SSE/并发连接耗尽线程。0=不限
  max_workers: 64

storage:
  root: "~/.fusion/artifacts"
  db_name: "meta.db"
  small_content_limit: 10240
  # C-1: artifact.sync 文件读写根目录，留空则禁用 sync；设为目录则限制 sync 路径在其下
  sync_root: ""
  # R9: 磁盘水位告警百分比（0-100），0=禁用监控
  disk_space_warning_pct: 90

thresholds:
  auto_create_lines: 30
  auto_create_chars: 1500

artifact:
  id_prefix: "art_"
  # R9: 单 artifact 版本上限，0=不限；超限淘汰最旧非快照版本
  max_versions_per_artifact: 100
  # P0-5/H9: 单版本内容字节上限，0=不限；超限拒绝写入防 OOM/磁盘耗尽
  max_content_bytes: 0
  # P0-5/H9: 单 artifact metadata JSON 字节上限，0=不限；超限拒绝写入
  max_metadata_bytes: 0
  # P0-5/H6: emit_event payload JSON 字节上限，默认 64KB；超限拒绝写入防事件总线放大
  max_event_payload_bytes: 65536

security:
  # C-4/P1-6: 默认 fail-closed。无 api_key 且 allow_no_auth=false 时拒绝所有请求（安全默认）。
  # 生产：设 api_key（env FUSION_ARTIFACTS_API_KEY 或下方 api_key 字段），鉴权 X-API-Key 头。
  # 本地单机受信网络：可显式 allow_no_auth=true 跳过鉴权（不推荐公网/多租户）。
  allow_no_auth: false
  recycle_retention_days: 7
  # L-6: share expires_at 最大 TTL（天），0=不限；过去日期一律拒绝
  share_max_ttl_days: 90

sse:
  heartbeat_interval: 30

rate_limit:
  # 运维1: 令牌桶限流。rps=0 表示不限流（向后兼容，但生产不建议）。
  # default 桶覆盖 JSON-RPC + 鉴权 REST；超限返回 429（JSON-RPC 用 -32003）
  # P1-1/H4: 生产默认值——default rps:200/burst:400，公开端点 rps:50/burst:100
  rps: 200
  burst: 400
  # 公开 share 端点独立配额（无鉴权，易被刷量）
  public_rps: 50
  public_burst: 100

metrics:
  # 运维2: Prometheus /metrics 端点开关。自实现文本格式，无外部依赖
  enabled: true
