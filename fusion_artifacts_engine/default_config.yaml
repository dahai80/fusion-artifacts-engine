# Default configuration for fusion-artifacts-engine

server:
  host: "127.0.0.1"
  port: 11451
  # R1: HTTP 线程池上限，防 SSE/并发连接耗尽线程。0=不限
  max_workers: 64

storage:
  root: "~/.fusion/artifacts"
  db_name: "meta.db"
  small_content_limit: 10240
  # C-1: artifact.sync 文件读写根目录，留空则禁用 sync；设为目录则限制 sync 路径在其下
  sync_root: ""
  # R9: 磁盘水位告警百分比（0-100），0=禁用监控
  disk_space_warning_pct: 90
  # P1-4: WAL 周期 checkpoint 间隔秒。0=禁用（依赖 SQLite 默认 1000 页自动）。
  # 生产建议 300——后台 PASSIVE checkpoint 控制 -wal 文件增长，配合 scripts/backup.sh 在线备份。
  wal_checkpoint_interval: 300
  # P2-7/F6: metadata 高频过滤字段名列表。对每个 key 建 json_extract 表达式索引，
  # 使 list 的 metadata_filter 不再全表扫。留空=不建索引（向后兼容）。
  # 仅可填安全标识符（字母/下划线/数字），用于常被过滤的 metadata 字段。
  metadata_indexed_keys: []

thresholds:
  auto_create_lines: 30
  auto_create_chars: 1500

artifact:
  id_prefix: "art_"
  # R9: 单 artifact 版本上限，0=不限；超限淘汰最旧非快照版本
  max_versions_per_artifact: 100
  # P0-5/H9: 单版本内容字节上限，0=不限；超限拒绝写入防 OOM/磁盘耗尽
  max_content_bytes: 0
  # P0-5/H9: 单 artifact metadata JSON 字节上限，0=不限；超限拒绝写入
  max_metadata_bytes: 0
  # P0-5/H6: emit_event payload JSON 字节上限，默认 64KB；超限拒绝写入防事件总线放大
  max_event_payload_bytes: 65536

security:
  # C-4/P1-6: 默认 fail-closed。无 api_key 且 allow_no_auth=false 时拒绝所有请求（安全默认）。
  # 生产：设 api_key（env FUSION_ARTIFACTS_API_KEY 或下方 api_key 字段），鉴权 X-API-Key 头。
  # 本地单机受信网络：可显式 allow_no_auth=true 跳过鉴权（不推荐公网/多租户）。
  allow_no_auth: false
  recycle_retention_days: 7
  # L-6: share expires_at 最大 TTL（天），0=不限；过去日期一律拒绝
  share_max_ttl_days: 90

share:
  # #83: 公开 share 页面 base URL（/s/<share_id>）。空=按 server.host/port 推导
  # （如 http://127.0.0.1:11451）。反向代理/公网部署时设为外部可达地址。
  public_base_url: ""

sse:
  heartbeat_interval: 30
  # P1-7/M7: SSE 单连接最大存活秒。0=不限。超时服务端主动关流促重连，防僵尸长连接占线程
  max_lifetime: 3600
  # F5: SSE 单事件序列化后字节上限。超限事件被丢弃（仅记日志），防大 payload 阻塞连接线程。0=不限
  max_event_bytes: 262144
  # P2-1: SSE 独立并发上限。握手后释放 RPC worker 槽、占此专用信号量，长连接不再独占 64 RPC 线程。
  # 0=不设独立上限（回退旧行为，不推荐）。本地单机 16 足够；多端共享调大需配合线程/fd 上限。
  max_connections: 16

rate_limit:
  # 运维1: 令牌桶限流。rps=0 表示不限流（向后兼容，但生产不建议）。
  # default 桶覆盖 JSON-RPC + 鉴权 REST；超限返回 429（JSON-RPC 用 -32003）
  # P1-1/H4: 生产默认值——default rps:200/burst:400，公开端点 rps:50/burst:100
  rps: 200
  burst: 400
  # 公开 share 端点独立配额（无鉴权，易被刷量）
  public_rps: 50
  public_burst: 100

metrics:
  # 运维2: Prometheus /metrics 端点开关。自实现文本格式，无外部依赖
  enabled: true
  # LOW-4: /metrics 可选 token 鉴权。设值后 /metrics 要求 X-Metrics-Token 头匹配。
  # 留空=不鉴权（依赖 127.0.0.1 绑定的本机隔离）。暴露 0.0.0.0 / 公网时必须设值。
  token: ""
tracing:
  # P2-5/H12(trace)/M20: OTel 分布式追踪开关。默认 false——local-first 单租户场景
  # 无需分布式追踪，且 opentelemetry-sdk 为可选依赖（pip install -e ".[otel]"）。
  # enabled=true 时记录 rpc.server.duration + db.storage.duration span，
  # 默认 ConsoleSpanExporter；生产经 OTEL_EXPORTER_OTLP_ENDPOINT 外接 OTLP collector。
  enabled: false
  service_name: "fusion-artifacts-engine"

gateway:
  # #75: web-shell 集成。enabled=true 时启动时向 fusion-gateway 自注册 shell
  # manifest（侧栏 Artifacts 菜单 + /shell/<module_id>/ 代理路由）并周期心跳。
  # #82: 注册体不带 api_key —— gateway 签发 fm- service key（raw_key 仅返回一次），
  # 引擎持久化到关键文件并用它心跳；引擎同时接受该 key 的 Bearer（代理注入通道）。
  enabled: false
  url: "http://127.0.0.1:11432"
  module_id: "fusion-artifacts"
  # 首次注册引导用（gateway web_shell.admin_key）；签发 fm- key 后不再需要。
  admin_key: ""
  # gateway 签发 key 的持久化文件；空=storage.root/gateway_service_key（权限 600）
  key_file: ""
  # 心跳间隔秒（gateway heartbeat_timeout 默认 30s，须小于它）
  heartbeat_interval: 15

ipc:
  # #84: fusion-design [Save to Artifacts] 文件 IPC 消费。enabled=true 时轮询
  # <base>/fusion-artifacts-engine/*.json，save_artifact 消息落库后归档。
  enabled: true
  # 消息目录；空= <FUSION_DESIGN_DATA_DIR 或 ~/.fusion-design>/fusion-artifacts-engine
  design_dir: ""
  # 轮询间隔秒
  poll_interval: 3.0
  # v0.7.0: fusion-office 文件摄取（docx/xlsx/pptx → 分段 markdown，section 可寻址；
  # patch/update 后写回导出到 <office_dir>/.outbox/）
  office_enabled: true
  # 消息目录；空= <FUSION_OFFICE_DATA_DIR 或 ~/.fusion-office>/fusion-artifacts-engine
  office_dir: ""

long_context:
  # v0.7.1 #91: 分层上下文压缩主机制（compactor 保持最后兜底）。
  # 滚动摘要：版本数达 summary_threshold 后用 fusion-mlx 生成 changelog 摘要，
  # 写回 artifact.summary（ref_text 自动携带）+ metadata.summary_version 防重。0=禁用
  summary_threshold: 5
  # 摘要生成模型；空=fusion-mlx 默认模型
  summary_model: ""
  mlx_url: "http://127.0.0.1:11434"
  # 空=env FUSION_MLX_API_KEY
  mlx_api_key: ""
  # RAG 归档：版本被取代时把旧版本推入 fusion-rag（幂等，metadata.archived_versions 防重）。
  # rag 不可达仅告警，绝不阻断版本创建。
  rag_enabled: true
  # /kb 前缀是 fusion-rag 应用层路由（/kb/bases/...）
  rag_url: "http://127.0.0.1:11436/kb"
  # 空=env FUSION_RAG_API_KEY
  rag_api_key: ""
  rag_kb_id: "fusion-artifacts"


ai:
  # v0.7.5 #97: webui AI 生成/迭代入口的后端（OpenAI 兼容 /v1/chat/completions）。
  base_url: "http://127.0.0.1:11434"
  # 空=自动取 /v1/models 第一个可用模型
  model: ""
  timeout: 120.0
  # 空=不发送 Authorization 头（fusion-mlx 本地默认无鉴权）
  api_key: ""
