# Default configuration for fusion-artifacts-engine

server:
  host: "127.0.0.1"
  port: 8892

storage:
  root: "~/.fusion/artifacts"
  db_name: "meta.db"
  small_content_limit: 10240

mlx:
  url: "http://localhost:8890"

thresholds:
  safe_context: 180000
  output_reserve: 8192
  auto_create_lines: 30
  auto_create_chars: 1500

artifact:
  id_prefix: "art_"

security:
  allow_no_auth: false
  recycle_retention_days: 7

sse:
  heartbeat_interval: 30
