name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

# Issue #126: cancel superseded doc-validation runs on the same ref.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py --root . --product fusion-artifacts-engine \
            --class app --entry service \
            --skip-dirs ".git,.venv,.ruff_cache,.remember,.claude,.fusion-code,logs,node_modules,dist,fusion_artifacts_engine.egg-info,build,.next"
