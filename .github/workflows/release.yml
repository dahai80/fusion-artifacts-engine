name: Release

# Auto-create GitHub Release on version tag push.
# Prevents the Releases page from lagging behind the code:
# a pushed git tag does NOT appear on the Releases tab by itself.
# Trigger: any tag matching v* (e.g. v0.5.0, v0.4.2-rc).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Issue #126: serialize tag builds but never cancel a running release —
# a cancelled release job would leave a pushed tag without a Release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  binaries:
    # Per-OS single-file PyInstaller binaries attached to the Release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: fusion-artifacts-engine-linux-x86_64
          - os: windows-latest
            artifact: fusion-artifacts-engine-windows-x86_64.exe
          - os: macos-latest
            artifact: fusion-artifacts-engine-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and PyInstaller
        run: pip install . pyinstaller

      - name: Build binary
        run: pyinstaller --clean -y packaging/fusion-artifacts-engine.spec

      - name: Smoke test
        shell: bash
        run: ./dist/fusion-artifacts-engine${{ runner.os == 'Windows' && '.exe' || '' }} version

      - name: Rename binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/fusion-artifacts-engine.exe dist/${{ matrix.artifact }}
          else
            mv dist/fusion-artifacts-engine dist/${{ matrix.artifact }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 3

  release:
    needs: binaries
    runs-on: ubuntu-latest
    # rc/pre-release tags skip the "latest" flag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release flags
        id: flags
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # rc / beta / alpha → pre-release, not latest
          if echo "$TAG" | grep -Eq 'rc|beta|alpha'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.flags.outputs.tag }}
          IS_PRERELEASE: ${{ steps.flags.outputs.prerelease }}
          IS_LATEST: ${{ steps.flags.outputs.latest }}
        run: |
          # Idempotent: a release may already exist if it was created manually
          # or by a previous run — duplicate create fails with 422 and leaves
          # the workflow red for no real reason (issue #65).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping create"
            exit 0
          fi
          ARGS=("$TAG" --generate-notes)
          [ "$IS_PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          [ "$IS_LATEST" = "true" ] && ARGS+=(--latest)
          gh release create "${ARGS[@]}"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload binaries to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.flags.outputs.tag }}
        run: |
          # Idempotent: clobber is fine on rerun (issue #65 class)
          gh release upload "$TAG" \
            dist/fusion-artifacts-engine-linux-x86_64 \
            dist/fusion-artifacts-engine-windows-x86_64.exe \
            dist/fusion-artifacts-engine-macos-arm64 \
            --clobber
