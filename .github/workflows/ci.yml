name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Issue #126: cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Issue #126: cache the pip download wheelhouse keyed on the
          # dependency declaration instead of re-downloading every run.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with test extras
        run: pip install -e ".[all]"

      - name: Lint (ruff)
        run: ruff check fusion_artifacts_engine/ tests/

      - name: Test (pytest)
        run: pytest tests/ -q
