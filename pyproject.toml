[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-artifacts-engine"
version = "0.3.7"
description = "Artifact management middleware for Fusion architecture"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "pyyaml>=6.0",  # config.py load_config() reads YAML config files
    "markdown>=3.5",  # _render_share_html renders markdown share preview
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
all = [
    "fusion-artifacts-engine[test]",
    "ruff>=0.6",
]

[project.scripts]
fusion-artifacts-engine = "fusion_artifacts_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["fusion_artifacts_engine*"]

[tool.setuptools.package-data]
fusion_artifacts_engine = ["default_config.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
